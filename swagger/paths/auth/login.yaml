tags:
  - Auth
summary: Login user
operationId: loginUser
description: 'Login user'
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          email:
            example: 'ann@maybe.com'
          password:
            example: 'ann1111'
responses:
  '200':
    description: User is logged in.
  '401':
    description: 'Unauthorized'
  '404':
    description: 'User not found'
